name: Release

# Changesets on main → a "Version Packages" PR (bumps the five @kilauea/*
# packages together, see .changeset/config.json). Main with no pending
# changesets → publish the current version to GitHub Packages as
# @prdlk/kilauea-* (scripts/publish-github.mjs; versions already published
# are skipped, so re-running is safe) and tag the commit.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/**"
      - "scripts/publish-github.mjs"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "Version Packages"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/publish-github.mjs | tee publish.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -euo pipefail
          grep -q '^→ ' publish.log || { echo "nothing new was published"; exit 0; }
          version=$(node -p "require('./packages/core/package.json').version")
          git tag -f "v$version"
          git push -f origin "v$version"
